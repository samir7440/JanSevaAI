<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content=
            "width=device-width, initial-scale=1.0"
    >

    <title>
        JanSeva AI Dashboard
    </title>

    <link
            href=
            "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Inter',sans-serif;

            background:
            linear-gradient(
                    180deg,
                    #0f172a 0%,
                    #111827 100%
            );

            color:white;

            min-height:100vh;

            padding:20px;
        }

        /* TOPBAR */

        .topbar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:20px 28px;

            border-radius:24px;

            background:
            rgba(17,24,39,0.92);

            border:
            1px solid rgba(255,255,255,0.06);

            backdrop-filter:blur(14px);

            margin-bottom:22px;
        }

        .topbar-left h1{

            font-size:34px;

            font-weight:900;

            letter-spacing:-1px;
        }

        .topbar-left p{

            margin-top:6px;

            color:#94a3b8;

            font-size:14px;
        }

        .live{

            padding:10px 18px;

            border-radius:999px;

            background:
            rgba(37,99,235,0.15);

            color:#60a5fa;

            font-size:13px;

            font-weight:700;
        }

        /* STATS */

        .stats-grid{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(220px,1fr));

            gap:18px;

            margin-bottom:24px;
        }

        .stat-card{

            background:
            rgba(17,24,39,0.94);

            border:
            1px solid rgba(255,255,255,0.06);

            border-radius:24px;

            padding:22px;

            position:relative;

            overflow:hidden;

            transition:0.25s;
        }

        .stat-card:hover{

            transform:
            translateY(-4px);
        }

        .stat-card::before{

            content:'';

            position:absolute;

            width:120px;

            height:120px;

            background:
            rgba(37,99,235,0.08);

            border-radius:50%;

            right:-30px;

            top:-30px;
        }

        .stat-title{

            font-size:13px;

            color:#94a3b8;

            font-weight:600;
        }

        .stat-number{

            margin-top:12px;

            font-size:42px;

            font-weight:900;
        }

        .blue{
            color:#60a5fa;
        }

        .yellow{
            color:#facc15;
        }

        .green{
            color:#4ade80;
        }

        .red{
            color:#fb7185;
        }

        /* TABLE */

        .table-card{

            background:
            rgba(17,24,39,0.94);

            border:
            1px solid rgba(255,255,255,0.06);

            border-radius:24px;

            overflow:hidden;
        }

        .table-top{

            padding:20px 24px;

            border-bottom:
            1px solid rgba(255,255,255,0.05);

            display:flex;

            justify-content:space-between;

            align-items:center;
        }

        .table-top h2{

            font-size:22px;

            font-weight:800;
        }

        .table-wrapper{
            overflow:auto;
        }

        table{

            width:100%;

            border-collapse:collapse;
        }

        th{

            background:
            rgba(37,99,235,0.15);

            color:#60a5fa;

            font-size:13px;

            font-weight:700;

            text-align:left;

            padding:18px;
        }

        td{

            padding:18px;

            border-bottom:
            1px solid rgba(255,255,255,0.04);

            font-size:14px;

            color:#e2e8f0;
        }

        tr:hover{

            background:
            rgba(255,255,255,0.02);
        }

        /* STATUS */

        .status{

            padding:8px 14px;

            border-radius:999px;

            font-size:12px;

            font-weight:800;

            display:inline-block;
        }

        .pending{

            background:
            rgba(250,204,21,0.14);

            color:#facc15;
        }

        .resolved{

            background:
            rgba(74,222,128,0.14);

            color:#4ade80;
        }

        .progress{

            background:
            rgba(96,165,250,0.14);

            color:#60a5fa;
        }

        /* OFFICER */

        .officer{

            display:flex;

            flex-direction:column;

            gap:4px;
        }

        .officer-name{

            font-weight:700;
        }

        .officer-contact{

            font-size:12px;

            color:#94a3b8;
        }

        /* MOBILE */

        @media(max-width:900px){

            body{
                padding:12px;
            }

            .topbar{

                flex-direction:column;

                align-items:flex-start;

                gap:14px;
            }

            .topbar-left h1{

                font-size:26px;
            }

            .stat-number{

                font-size:32px;
            }

            th,
            td{

                padding:12px;

                font-size:12px;
            }

        }

    </style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

    <div class="topbar-left">

        <h1>
            JanSeva AI Dashboard
        </h1>

        <p>
            Smart Governance Monitoring System
        </p>

    </div>

    <div class="live">
        ● LIVE SYSTEM
    </div>

</div>

<!-- STATS -->

<div class="stats-grid">

    <div class="stat-card">

        <div class="stat-title">
            Total Complaints
        </div>

        <div
                class="stat-number blue"
                th:text="${total}"
        >
            0
        </div>

    </div>

    <div class="stat-card">

        <div class="stat-title">
            Pending Complaints
        </div>

        <div
                class="stat-number yellow"
                th:text="${pending}"
        >
            0
        </div>

    </div>

    <div class="stat-card">

        <div class="stat-title">
            Resolved Complaints
        </div>

        <div
                class="stat-number green"
                th:text="${resolved}"
        >
            0
        </div>

    </div>

    <div class="stat-card">

        <div class="stat-title">
            In Progress
        </div>

        <div class="stat-number red">

            <span
                    th:text=
                    "${total - resolved - pending}"
            >
                0
            </span>

        </div>

    </div>

</div>

<!-- TABLE -->

<div class="table-card">

    <div class="table-top">

        <h2>
            Complaint Monitoring
        </h2>

    </div>

    <div class="table-wrapper">

        <table>

            <thead>

            <tr>

                <th>
                    Complaint ID
                </th>

                <th>
                    Department
                </th>

                <th>
                    Problem
                </th>

                <th>
                    Status
                </th>

                <th>
                    Level
                </th>

                <th>
                    Assigned Officer
                </th>

                <th>
                    Date & Time
                </th>

            </tr>

            </thead>

            <tbody>

            <tr
                    th:each=
                    "c : ${complaints}"
            >

                <td
                        th:text=
                        "${c.complaintId}"
                >
                </td>

                <td
                        th:text=
                        "${c.mainCategory}"
                >
                </td>

                <td
                        th:text=
                        "${c.subCategory}"
                >
                </td>

                <td>

                    <span

                            th:class="${
                            c.status == 'RESOLVED'
                            ?
                            'status resolved'
                            :
                            (
                            c.status == 'PENDING'
                            ?
                            'status pending'
                            :
                            'status progress'
                            )
                            }"

                            th:text="${c.status}"
                    >

                    </span>

                </td>

                <td
                        th:text=
                        "${c.currentLevel}"
                >
                </td>

                <td>

                    <div class="officer">

                        <div
                                class="officer-name"

                                th:text=
                                "${c.assignedPersonName}"
                        >
                        </div>

                        <div
                                class="officer-contact"

                                th:text=
                                "${c.assignedPersonContact}"
                        >
                        </div>

                    </div>

                </td>

                <td
                        th:text=
                        "${#temporals.format(
                        c.createdAt,
                        'dd MMM yyyy hh:mm a'
                        )}"
                >
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
